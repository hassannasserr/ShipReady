project:
  name: demo-commerce
  adapter: demo-express
  base_url: http://127.0.0.1:3000

health_check:
  path: /health
  expected_status: 200
  timeout_seconds: 5

database:
  type: mongodb
  disposable_test_database: true

execution:
  max_run_seconds: 300
  scenario_timeout_seconds: 30
  allow_external_network: false

scenarios:
  - I-01
  - B-01
  - B-02
  - B-03

business_invariants:
  - payment_has_operation_id
  - payment_is_associated_with_order
  - one_logical_payment_recorded
  - paid_order_matches_success
