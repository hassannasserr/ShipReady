[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shipready"
version = "0.1.0"
description = "Local-first QA automation and production-readiness assessment tool."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8.2,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.5,<1",
]

[project.scripts]
shipready = "shipready.agent.cli:app"

[tool.setuptools.packages.find]
include = ["shipready*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["shipready"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
