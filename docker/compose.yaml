services:
  mongo:
    image: mongo:7.0
    restart: "no"
    command: ["mongod", "--bind_ip_all"]
    networks:
      - demo-internal
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - demo-mongo-data:/data/db

  app:
    build:
      context: ../demo_app
    restart: "no"
    environment:
      PORT: "3000"
      MONGO_URI: mongodb://mongo:27017/shipready_demo
      DEFECT_MODE: ${DEFECT_MODE:-}
    ports:
      - "127.0.0.1:${SHIPREADY_DEMO_PORT:-3000}:3000"
    networks:
      - demo-internal
      - demo-host
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

networks:
  demo-internal:
    internal: true
  demo-host:

volumes:
  demo-mongo-data:
